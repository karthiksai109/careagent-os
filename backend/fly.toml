app = "careagent-os-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  CORS_ORIGINS = "https://careagent-os-app.netlify.app,http://localhost:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
